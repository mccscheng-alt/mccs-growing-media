name: Site Quality Audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'

permissions:
  contents: read

jobs:
  static-site-audit:
    name: Static HTML, links and schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image audit dependency
        run: python -m pip install Pillow
      - name: Verify generated pages are synchronized
        run: |
          node scripts/sync-cf-product-models.mjs
          node scripts/generate-static-product-catalogs.mjs
          node scripts/normalize-site-content.mjs
          node scripts/sync-factory-demonstrations.mjs
          node scripts/sync-consent-mode.mjs
          python scripts/optimize-image-markup.py
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            printf '%s\n' "Generated files missing from the commit:" "$untracked"
            exit 1
          fi
          git diff --exit-code
      - name: Audit public pages
        run: python scripts/audit-site.py
      - name: Audit JSON-LD inventory
        run: node scripts/audit-json-ld.mjs --strict
      - name: Test form protection and lead tracking
        run: node scripts/test-form-protection.cjs
      - name: Test analytics IDs and buyer interaction tracking
        run: node scripts/test-analytics.cjs
      - name: Test root evidence generator regression
        run: node scripts/test-root-evidence-generators.cjs
      - name: Test factory demonstrations and localized regeneration
        run: node scripts/test-factory-demonstrations.cjs
      - name: Report broken external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --root-dir "$(pwd)"
            --cache
            --no-progress
            --include-mail=false
            --accept "200..=399,403"
            --exclude-path "(^|/)(privacy|terms)[.]html$"
            './**/*.html'
          fail: true
          jobSummary: true
          token: ${{ secrets.GITHUB_TOKEN }}

  production-lighthouse:
    name: Production Lighthouse baseline
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Lighthouse CI
        run: npm install --global @lhci/cli@0.15.x
      - name: Audit production priority pages
        run: lhci autorun
      - name: Upload Lighthouse reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-production-report
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: warn

  pull-request-lighthouse:
    name: Pull request Lighthouse gate
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lighthouse CI
        run: npm install --global @lhci/cli@0.15.x
      - name: Audit pull request pages
        run: lhci autorun --config=lighthouserc.pr.json
      - name: Upload Lighthouse reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-pull-request-report
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: warn

